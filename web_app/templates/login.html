{% extends 'base_public.html' %}
{% block content %}
<div class="login-container">
  <div class="login-card">
    <!-- Logo and Header Section -->
    <div class="login-header">
      <div class="logo-container">
        <div class="logo-circle">
          <i class="bi bi-eye-fill"></i>
        </div>
        <div class="logo-pulse"></div>
      </div>
      <h1 class="system-title">المراقب الذكي</h1>
      <p class="system-subtitle">Smart Monitoring System</p>
      <div class="header-divider"></div>
    </div>

    <!-- Login Form -->
    <div class="login-body">
      <h2 class="welcome-text">مرحباً بك</h2>
      <p class="login-subtitle">قم بتسجيل الدخول للمتابعة</p>
      
      <form method="post" class="login-form">
        <div class="form-group">
          <label class="form-label">
            <i class="bi bi-person-circle"></i>
            اسم المستخدم
          </label>
          <div class="input-wrapper">
            <input 
              name="username" 
              type="text" 
              class="form-input" 
              placeholder="أدخل اسم المستخدم" 
              required 
              autofocus 
            />
            <div class="input-icon">
              <i class="bi bi-person"></i>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">
            <i class="bi bi-shield-lock"></i>
            كلمة المرور
          </label>
          <div class="input-wrapper">
            <input 
              name="password" 
              type="password" 
              class="form-input" 
              placeholder="أدخل كلمة المرور" 
              required 
            />
            <div class="input-icon">
              <i class="bi bi-lock"></i>
            </div>
          </div>
        </div>

        <button type="submit" class="login-button">
          <span class="button-text">تسجيل الدخول</span>
          <i class="bi bi-arrow-left button-icon"></i>
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <div class="info-badge">
        <i class="bi bi-info-circle-fill"></i>
        <span>حسابات تجريبية متاحة</span>
      </div>
      <div class="demo-users">
        <span class="demo-tag" onclick="fillLogin('admin', 'admin')">admin</span>
        <span class="demo-tag" onclick="fillLogin('manager', 'manager')">manager</span>
        <span class="demo-tag" onclick="fillLogin('operator', 'operator')">operator</span>
      </div>
    </div>
  </div>

  <!-- Background Decorations -->
  <div class="bg-decoration decoration-1"></div>
  <div class="bg-decoration decoration-2"></div>
  <div class="bg-decoration decoration-3"></div>
</div>

<script>
function fillLogin(username, password) {
  console.log('Filling login with:', username);
  
  // الحصول على الحقول
  var usernameInput = document.querySelector('input[name="username"]');
  var passwordInput = document.querySelector('input[name="password"]');
  var form = document.querySelector('.login-form');
  
  if (!usernameInput || !passwordInput || !form) {
    console.error('Could not find form elements');
    return;
  }
  
  // ملء حقول تسجيل الدخول
  usernameInput.value = username;
  passwordInput.value = password;
  
  // إضافة تأثير بصري
  usernameInput.style.borderColor = '#667eea';
  passwordInput.style.borderColor = '#667eea';
  
  console.log('Values set, submitting...');
  
  // تسجيل الدخول تلقائياً
  setTimeout(function() {
    form.submit();
  }, 500);
}

// التأكد من تحميل DOM
document.addEventListener('DOMContentLoaded', function() {
  console.log('Page loaded, ready for login');
});
</script>
{% endblock %}
